version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # UI. `directory` is where the manifest lives, so npm points at
  # /ui and docker needs its own entry for ui/Containerfile — the
  # root docker entry above only sees the agent's.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/ui"
    schedule:
      interval: weekly
